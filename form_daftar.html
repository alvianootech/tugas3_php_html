<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elemen Formulir HTML & Persiapan Integrasi Backend PHP</title>
</head>
<body>
    <h2>Formulir Pendaftaran Anggota</h2>

    <form action="proses.php" method="post">
        <fieldset>
            <legend>Data Anggota</legend>
            <label for="nama_lengkap">Nama Lengkap:</label>
            <input type="text" name="nama_lengkap" id="nama_lengkap" placeholder="Masukkan nama lengkap" required>
            <br><br>

            <label for="email">Alamat Email:</label>
            <input type="email" name="email" id="email" placeholder="Masukkan email" required>
            <br><br>

            <label for="password">Kata Sandi:</label>
            <input type="password" name="password" id="password" required>
            <br><br>

            <label for="jenis_kelamin">Jenis Kelamin:</label>

            <input type="radio" name="jenis_kelamin" id="laki-laki" value="laki-laki">
            <label for="laki-laki">Laki-laki</label>

            <input type="radio" name="jenis_kelamin" id="perempuan" value="perempuan">
            <label for="perempuan">Perempuan</label>
            <br><br>

            <label for="jurusan">Jurusan / Divisi:</label>
            <select name="jurusan" id="jurusan" required>
                <option value="">-- Pilih Jurusan/Divisi --</option>
                <option value="DPIB">DPIB</option>
                <option value="RPL">RPL</option>
                <option value="PSPT">PSPT</option>
                <option value="TKJ">TKJ</option>
                <option value="DKV">DKV</option>
            </select>
            <br><br>

            <label for="keahlian">Keahlian:</label><br>
            <input type="checkbox" name="keahlian[]" id="keahlian1" value="Web Development">
            <label for="keahlian1">Web Development</label><br>

            <input type="checkbox" name="keahlian[]" id="keahlian2" value="Mobile Development">
            <label for="keahlian2">Mobile Development</label><br>

            <input type="checkbox" name="keahlian[]" id="keahlian3" value="UI/UX Design">
            <label for="keahlian3">UI/UX Design</label>
            <br><br>

            <label for="alamat">Alamat Lengkap:</label><br>
            <textarea name="alamat" id="alamat" cols="40" rows="5" placeholder="Masukkan alamat lengkap"></textarea>
            <br><br>

            <button type="submit">Kirim</button>
            <button type="reset">Batal</button>
        </fieldset>
    </form>
</body>
</html>
